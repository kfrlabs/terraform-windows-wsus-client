name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform init -backend=false -input=false
        working-directory: examples/basic
      - run: terraform validate
        working-directory: examples/basic
      - run: terraform init -backend=false -input=false
        working-directory: examples/scheduled
      - run: terraform validate
        working-directory: examples/scheduled
      - run: terraform init -backend=false -input=false
        working-directory: examples/active-hours
      - run: terraform validate
        working-directory: examples/active-hours

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.66.0
      - run: tflint --init --config=.tflint.hcl
      - run: tflint --config=$GITHUB_WORKSPACE/.tflint.hcl --recursive

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Root README.md only; examples READMEs are hand-written.
      - name: Check README docs
        run: |
          curl -sSL -o /tmp/td.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.20.0/terraform-docs-v0.20.0-linux-amd64.tar.gz
          echo "34ae01772412bb11474e6718ea62113e38ff5964ee570a98c69fafe3a6dff286  /tmp/td.tar.gz" | sha256sum -c -
          tar xzf /tmp/td.tar.gz -C /tmp terraform-docs
          /tmp/terraform-docs . --output-check
