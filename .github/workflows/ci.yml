name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform init -backend=false -input=false
        working-directory: examples/basic
      - run: terraform validate
        working-directory: examples/basic
      - run: terraform init -backend=false -input=false
        working-directory: examples/scheduled
      - run: terraform validate
        working-directory: examples/scheduled
      - run: terraform init -backend=false -input=false
        working-directory: examples/active-hours
      - run: terraform validate
        working-directory: examples/active-hours

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config=.tflint.hcl
      - run: tflint --config=$GITHUB_WORKSPACE/.tflint.hcl --recursive

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Root README.md only; examples READMEs are hand-written.
      - run: curl -sSL -o /tmp/td.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.20.0/terraform-docs-v0.20.0-linux-amd64.tar.gz && tar xzf /tmp/td.tar.gz -C /tmp terraform-docs && /tmp/terraform-docs . --output-check
