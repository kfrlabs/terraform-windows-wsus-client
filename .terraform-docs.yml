formatter: markdown

header-from: main.tf
footer-from: ""

content: |-
  {{ .Providers }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

settings:
  anchor: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent-level: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
